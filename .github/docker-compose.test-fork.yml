# Fork variant of docker-compose.test.yml: runs the Unleash image built from
# THIS repo's source (loaded as unleash-fork:test) instead of the prebuilt
# unleashorg/unleash-enterprise image, so e2e actually tests the fork's code.
# The image serves the built frontend itself, so no separate frontend proxy
# container is needed — Cypress targets http://localhost:4242 directly.
services:
  unleash:
    image: unleash-fork:test
    pull_policy: never
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:unleash@db/unleash"
      DATABASE_SSL: "false"
      LOG_LEVEL: "info"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget -nv -t1 --spider http://localhost:4242/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "unleash"
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_PASSWORD: "unleash"
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 30
