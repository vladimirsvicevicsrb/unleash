name: Nightly fork sync with upstream Unleash

# Keeps this private fork up to date with Unleash/unleash (OSS) while
# preserving our own changes on main.
#
# How it works:
#   - A bot branch `sync/upstream-main` is force-pushed to exactly match
#     upstream main on every run.
#   - A PR from that branch into our main is opened if one doesn't exist;
#     if last morning's PR is still unmerged, the force-push simply updates
#     the SAME PR (a PR follows its head branch) — no duplicate PRs.
#   - Merge the PR with a MERGE COMMIT (not squash!) so the merge-base
#     advances and the next sync only shows genuinely new upstream commits.
on:
  schedule:
    # 06:00 UTC Mon-Fri = 08:00 CEST (07:00 in winter — cron has no DST)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: sync/upstream-main
  UPSTREAM_REPO: https://github.com/Unleash/unleash.git

jobs:
  sync:
    # Never run on the upstream repo itself, only on the fork
    if: github.repository_owner != 'Unleash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          NEW=$(git rev-list --count main..upstream/main)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Upstream is ahead of our main by $NEW commits"

      - name: Update sync branch to mirror upstream main
        if: steps.check.outputs.new != '0'
        run: |
          git push --force origin upstream/main:refs/heads/$SYNC_BRANCH

      - name: Open PR if none exists (otherwise the push above updated it)
        if: steps.check.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --head "$SYNC_BRANCH" \
              --base main \
              --title "chore: sync with upstream Unleash main" \
              --body "Automated sync PR: brings the latest \`Unleash/unleash:main\` commits into this fork while keeping our changes on \`main\`.

          - **Merge with a merge commit — do NOT squash.** Squashing prevents the merge-base from advancing and every future sync will re-show (and re-conflict on) the same commits.
          - If GitHub reports conflicts, resolve them in the web editor or locally on \`$SYNC_BRANCH\`, then merge.
          - If this PR is left unmerged, the next scheduled run force-updates this same PR with newer upstream commits instead of opening a new one."
          else
            echo "Open sync PR already exists - the force-push updated it."
          fi

      - name: Nothing to sync
        if: steps.check.outputs.new == '0'
        run: echo "Fork main already contains all upstream commits. Skipping."
