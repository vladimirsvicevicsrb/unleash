name: Build Unleash Docker image

# Reusable: builds the Unleash image from this repo's source and uploads it as
# an artifact. Callers load it with `docker load` (see e2e.frontend.fork.yml).
# Split out so a future "push to Artifact Registry / deploy" workflow can reuse
# the exact same build instead of duplicating it.
on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Local tag to build, e.g. unleash-fork:test'
        type: string
        default: 'unleash-fork:test'
      artifact-name:
        description: 'Name of the uploaded image artifact'
        type: string
        default: 'unleash-fork-image'
      platform:
        description: 'Target platform. linux/amd64 is required by Cloud Run.'
        type: string
        default: 'linux/amd64'
      retention-days:
        description: 'How long to keep the image artifact'
        type: number
        default: 1
    outputs:
      artifact-name:
        description: 'Name of the uploaded image artifact'
        value: ${{ inputs.artifact-name }}
      image-tag:
        description: 'Tag the image was built with'
        value: ${{ inputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          tags: ${{ inputs.image-tag }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image
        run: docker save "${{ inputs.image-tag }}" | gzip > /tmp/image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: /tmp/image.tar.gz
          retention-days: ${{ inputs.retention-days }}
